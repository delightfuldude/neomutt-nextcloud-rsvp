# Set these after each account sets $from, including during account switches.
setenv NEOMUTT_RSVP_PYTHON "$HOME/.local/share/neomutt-nextcloud-rsvp/venv/bin/python"
setenv NEOMUTT_CALENDAR_EMAIL "$from"

# Merge mailcap entries into the file your NeoMutt configuration uses.
set mailcap_path = "~/.config/mailcap"
auto_view text/calendar application/ics

# Existing mutt-wizard users already have these bindings.
bind pager l view-attachments
bind attach l view-mailcap
bind attach <return> view-mailcap
