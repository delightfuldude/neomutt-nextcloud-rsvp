# Adapt and merge into your existing config. No credential is stored here.
[general]
status_path = "~/.local/state/vdirsyncer"

[pair personal]
a = "personal_local"
b = "personal_remote"
collections = ["personal"]

[storage personal_local]
type = "filesystem"
path = "~/.local/share/vdir/calendars/"
fileext = ".ics"

[storage personal_remote]
type = "caldav"
url = "https://cloud.example.org/remote.php/dav/"
username = "alice"
# This example expects an existing pass entry containing only the app password.
password.fetch = ["command", "pass", "show", "nextcloud/personal-app-password"]
