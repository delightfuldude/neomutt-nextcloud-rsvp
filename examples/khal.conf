# Merge this calendar into your existing khal config; adapt names and paths.
[calendars]
[[personal]]
path = ~/.local/share/vdir/calendars/personal
type = calendar
addresses = alice@example.org

[locale]
timeformat = %H:%M
dateformat = %Y-%m-%d
longdateformat = %Y-%m-%d
datetimeformat = %Y-%m-%d %H:%M
longdatetimeformat = %Y-%m-%d %H:%M
default_timezone = Europe/Vienna

[default]
default_calendar = personal
